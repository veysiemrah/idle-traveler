<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Idle Traveler</title>
  <meta name="description" content="Manzaralı bir yolda rahatlatıcı bir idle yolculuk oyunu. Yürüyerek başla; yolun seni nereye götüreceğini keşfet.">
  <link rel="canonical" href="https://idle-traveler.vebaban.com/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://idle-traveler.vebaban.com/">
  <meta property="og:title" content="Idle Traveler">
  <meta property="og:description" content="Manzaralı bir yolda rahatlatıcı bir yolculuk. Yürüyerek başla; yolun seni nereye götüreceğini keşfet.">
  <meta property="og:locale" content="tr_TR">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e2140'/%3E%3Ccircle cx='44' cy='20' r='8' fill='%23ffd56b'/%3E%3Cpath d='M0 46 L18 30 L30 40 L42 28 L64 46 V64 H0Z' fill='%236fd3c1'/%3E%3Cpath d='M0 54 H64 V64 H0Z' fill='%23ffb067'/%3E%3C/svg%3E">
  <meta name="theme-color" content="#eef0f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e2140" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--APP-->
<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1e2140"/><circle cx="44" cy="20" r="8" fill="#ffd56b"/><path d="M0 46 L18 30 L30 40 L42 28 L64 46 V64 H0Z" fill="#6fd3c1"/><path d="M0 54 H64 V64 H0Z" fill="#ffb067"/></svg>
      <span class="brand-name">Idle Traveler</span>
      <button class="ver" id="btnNews" type="button" title="Yenilikler" data-i18n-title="html.news">
        <span class="ver-label" data-i18n="html.news">Yenilikler</span><b id="verNum">v1.9</b><i class="ver-dot" aria-hidden="true" hidden></i>
      </button>
    </div>
    <div class="top-tools">
      <button class="iconbtn" id="btnSettings" type="button" title="Ayarlar" data-i18n-title="j.settings" data-i18n-aria="j.settings" aria-label="Ayarlar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
      <button class="iconbtn" id="btnPhoto" type="button" title="Kartpostal çek" data-i18n-title="html.photo" data-i18n-aria="html.photo" aria-label="Kartpostal çek">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.6-2.2h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="var(--ink-2)" stroke-width="1.8"/></svg>
      </button>
      <button class="iconbtn" id="btnSky" type="button" title="Geceye geç">
        <svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
        <span class="sr" data-i18n="html.dayNight">Gündüz / gece</span>
      </button>
      <button class="iconbtn" id="btnSound" type="button" aria-pressed="true" title="Sesi kapat">
        <svg class="ico-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="ico-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span class="sr" data-i18n="html.sound">Ses</span>
      </button>
    </div>
  </header>
  <main class="stage" id="stage" aria-label="Yolculuk sahnesi. Adım atmak için dokun ya da Boşluk tuşuna bas." data-i18n-aria="html.stageLabel">
    <canvas id="scene"></canvas>

    <header class="hud">
      <div class="hud-card">
        <p class="eyebrow" data-i18n="html.here">Şu an buradasın</p>
        <p class="region" id="hudRegion">Sabah Köyü</p>
        <p class="dist" id="hudDist">0 m</p>
        <p class="hud-row"><span class="speed" id="hudSpeed">0 km/sa</span><span class="dotsep" aria-hidden="true"></span><span id="hudVehicle">Yürüyüş</span></p>
      </div>
    </header>

    <div class="effects" id="effects" aria-live="polite"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>

    <div class="banner" id="banner" hidden>
      <p class="eyebrow" data-i18n="html.newRegion">Yeni bölge keşfedildi</p>
      <p class="banner-name" id="bannerName"></p>
      <p class="banner-sub" id="bannerSub"></p>
    </div>

    <p class="hint" id="hint"><span data-i18n="html.hint">Adım atmak için dokun</span><small data-i18n="html.hint2">ya da Boşluk tuşuna bas</small></p>

    <footer class="trail">
      <div class="rhythm" title="Hızlı ve ritmik tıklamalar adımlarını uzatır" data-i18n-title="html.rhythmTip">
        <span class="lbl" data-i18n="html.rhythm">Ritim</span>
        <span class="bar"><i id="rhythmFill"></i></span>
        <b id="rhythmVal">×1,00</b>
      </div>
      <div class="milestone">
        <div class="ms-top"><span class="lbl" data-i18n="html.nextStop">Sıradaki durak</span><b id="msName">İlk yüz metre</b><span id="msProg" class="ms-prog"></span></div>
        <span class="bar"><i id="msFill"></i></span>
      </div>
    </footer>
  </main>

  <aside class="panel" id="panel">
    <div class="wallet">
      <i class="coin big" aria-hidden="true"></i>
      <div>
        <p class="eyebrow" data-i18n="html.wallet">Yol kredisi</p>
        <p class="credits" id="credits">0</p>
      </div>
      <p class="income" id="income">+0 / sn</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Mağaza" data-i18n-aria="html.shop">
      <button class="tab" role="tab" data-act="tab" data-id="garage" aria-selected="true" data-i18n="tab.garage">Garaj</button>
      <button class="tab" role="tab" data-act="tab" data-id="buffs" aria-selected="false" data-i18n="tab.buffs">Güçlendirmeler</button>
      <button class="tab" role="tab" data-act="tab" data-id="journal" aria-selected="false" data-i18n="tab.journal">Yol Defteri</button>
    </nav>
    <div class="panes">
      <section class="tabpane" id="pane-garage" role="tabpanel"></section>
      <section class="tabpane" id="pane-buffs" role="tabpanel" hidden></section>
      <section class="tabpane" id="pane-journal" role="tabpanel" hidden></section>
    </div>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true">
    <div id="modalBody"></div>
    <button class="primary" id="modalBtn" type="button" data-i18n="html.ok">Tamam</button>
  </div>
</div>
<!--/APP-->

<script src="js/i18n.js"></script>
<script src="js/lang/tr.js"></script>
<script src="js/lang/en.js"></script>
<script src="js/lang/de.js"></script>
<script src="js/lang/es.js"></script>
<script src="js/lang/fr.js"></script>
<script src="js/changelog.js"></script>
<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/scene.js"></script>
<script src="js/game.js"></script>
</body>
</html>
